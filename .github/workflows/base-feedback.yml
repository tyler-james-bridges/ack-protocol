name: Base feedback index

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  group: base-feedback-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backfill Base feedback
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: npx tsx scripts/backfill-base-feedback.ts
